        <div class="diary-text">今日は、夏っぽさに逆らってかき氷を食べたワン。すぐ消えるのに、雪みたいに記憶だけ残るのが好きだワン。昼は雑味少なめの久保田が、するっと入って気持ちよかったワン。晩酌は最初に水からいく逆張りで、スパムの塩気にアサヒ生が刺さって、なんだか勝った気分だったワン。海はだいたいしょっぱいけど、モルディブみたいに何もない贅沢も強いと思うワン。そんなことを考えながら、台風情報は名前で騒がず進路を見るのが大事だと再確認したワン。夜は静かな部屋で温かい飲み物を飲んで、変な発想を少しだけ楽しんだワン。</div>
