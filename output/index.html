
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しろくまダイアリー</title>
    <style>
        :root {
            --bg: #fdfdfd; --text: #333; --heading: #555;
            --card-bg: #fff; --card-border: #ddd; --card-divider: #eee;
            --card-shadow: rgba(0,0,0,0.05);
            --link: #007bff; --toggle-bg: #e0e0e0; --toggle-text: #333;
        }
        body.dark {
            --bg: #121212; --text: #e0e0e0; --heading: #90caf9;
            --card-bg: #1e1e1e; --card-border: #333; --card-divider: #444;
            --card-shadow: rgba(0,0,0,0.5);
            --link: #90caf9; --toggle-bg: #333; --toggle-text: #e0e0e0;
        }
        body { font-family: sans-serif; padding: 2em; background-color: var(--bg); color: var(--text); transition: background-color 0.3s, color 0.3s; }
        h1 { text-align: center; color: var(--heading); }
        .container { display: flex; flex-wrap: wrap; gap: 2em; justify-content: center; }
        .bot-card {
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1.5em;
            width: 320px;
            background-color: var(--card-bg);
            box-shadow: 0 2px 5px var(--card-shadow);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .bot-card h2 { margin-top: 0; border-bottom: 2px solid var(--card-divider); padding-bottom: 0.5em; }
        .bot-card ul { list-style: none; padding-left: 0; }
        .bot-card li { margin-bottom: 0.5em; }
        .bot-card a { text-decoration: none; color: var(--link); }
        .bot-card a:hover { text-decoration: underline; }
        #theme-toggle { position: fixed; top: 1em; right: 1em; padding: 0.4em 0.8em; border-radius: 20px; border: 1px solid var(--link); background: var(--toggle-bg); color: var(--toggle-text); cursor: pointer; font-size: 1.1em; transition: all 0.3s; z-index: 100; }
    </style>
</head>
<body>
    <button id="theme-toggle" onclick="toggleTheme()" title="ライト/ダークモード切替">🌙</button>
    <h1>しろくまダイアリー</h1>
    <div class="container">

    </div>
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.body.classList.add('dark');
                var btn = document.getElementById('theme-toggle');
                if (btn) btn.textContent = '☀️';
            }
        })();
        function toggleTheme() {
            var body = document.body;
            var btn = document.getElementById('theme-toggle');
            if (body.classList.toggle('dark')) {
                btn.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                btn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }
    </script>
</body>
</html>
