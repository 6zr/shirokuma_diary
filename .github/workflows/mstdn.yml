name: Generate Shirokuma Diary

on:
  schedule:
    # 毎日13時0分(UTC)に実行
    # 日本時間(JST)ではUTC+9なので22時00分
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      bot_name:
        description: 'Run for a specific bot (e.g., shirokuma_neo_bot). Leave empty to run for all bots.'
        required: false
        default: ''
    
# '898916',しろくま長男,1
# '899678',しろくまパパ,2
# '110084966389366193',AIクマ,7
# '111713508453320063',グウさん,8

jobs:
  make_diary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set JST Date
        run: echo "DIARY_DATE=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 使用するNode.jsのバージョンを指定

      - name: Install dependencies
        run: npm install # package.jsonの通り依存ライブラリをインストール

      - name: Restore diary files
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: output
        continue-on-error: true

      - name: shirokuma_bot
        if: github.event.inputs.bot_name == '' || github.event.inputs.bot_name == 'shirokuma_bot'
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_JP_OWNER_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ vars.MASTODON_JP_URL }}
          SHIROKUMA_ENGINE_USER: ${{ secrets.SHIROKUMA_ENGINE_USER }}
          SHIROKUMA_ENGINE_PASSWORD: ${{ secrets.SHIROKUMA_ENGINE_PASSWORD }}
          OPENAI_APIKEY: ${{ secrets.OPENAI_APIKEY }}
          BEAR_NAME: 'shirokuma_bot'
          DIARY_DATE: ${{ env.DIARY_DATE }}
        run: node scripts/make_diary.js

      - name: shirokumadadbot
        if: github.event.inputs.bot_name == '' || github.event.inputs.bot_name == 'shirokumadadbot'
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_JP_OWNER_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ vars.MASTODON_JP_URL }}
          SHIROKUMA_ENGINE_USER: ${{ secrets.SHIROKUMA_ENGINE_USER }}
          SHIROKUMA_ENGINE_PASSWORD: ${{ secrets.SHIROKUMA_ENGINE_PASSWORD }}
          OPENAI_APIKEY: ${{ secrets.OPENAI_APIKEY }}
          BEAR_NAME: 'shirokumadadbot'
          DIARY_DATE: ${{ env.DIARY_DATE }}
        run: node scripts/make_diary.js

      - name: shirokuma_ai_bot
        if: github.event.inputs.bot_name == '' || github.event.inputs.bot_name == 'shirokuma_ai_bot'
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_JP_OWNER_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ vars.MASTODON_JP_URL }}
          OPENAI_APIKEY: ${{ secrets.OPENAI_APIKEY }}
          BEAR_NAME: 'shirokuma_ai_bot'
          DIARY_DATE: ${{ env.DIARY_DATE }}
        run: node scripts/make_ai_diary.js

      - name: goosan_bot
        if: github.event.inputs.bot_name == '' || github.event.inputs.bot_name == 'goosan_bot'
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_JP_OWNER_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ vars.MASTODON_JP_URL }}
          OPENAI_APIKEY: ${{ secrets.OPENAI_APIKEY }}
          BEAR_NAME: 'goosan_bot'
          DIARY_DATE: ${{ env.DIARY_DATE }}
        run: node scripts/make_ai_diary.js

      - name: shirokuma_neo_bot
        if: github.event.inputs.bot_name == '' || github.event.inputs.bot_name == 'shirokuma_neo_bot'
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_SOCIAL_OWNER_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ vars.MASTODON_SOCIAL_URL }}
          OPENAI_APIKEY: ${{ secrets.OPENAI_APIKEY }}
          BEAR_NAME: 'shirokuma_neo_bot'
          DIARY_DATE: ${{ env.DIARY_DATE }}
        run: node scripts/make_ai_diary.js

      - name: abe_kuma_bot
        if: github.event.inputs.bot_name == '' || github.event.inputs.bot_name == 'abe_kuma_bot'
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_JP_OWNER_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ vars.MASTODON_JP_URL }}
          SHIROKUMA_ENGINE_USER: ${{ secrets.SHIROKUMA_ENGINE_USER }}
          SHIROKUMA_ENGINE_PASSWORD: ${{ secrets.SHIROKUMA_ENGINE_PASSWORD }}
          OPENAI_APIKEY: ${{ secrets.OPENAI_APIKEY }}
          BEAR_NAME: 'abe_kuma_bot'
          DIARY_DATE: ${{ env.DIARY_DATE }}
        run: node scripts/make_abe_diary.js

      - name: Compress images
        run: |
          # 毎回updateすると遅いため、installのみ試行し、失敗した場合のみupdateする
          sudo apt-get install -y pngquant || (sudo apt-get update && sudo apt-get install -y pngquant)
          
          echo "Target Date: ${DIARY_DATE}"
          echo "Searching for images to compress..."
          
          # 圧縮対象のファイルをリストアップして表示
          TARGET_FILES=$(find output -name "${DIARY_DATE}.png")
          
          if [ -z "$TARGET_FILES" ]; then
            echo "No images found for date ${DIARY_DATE}."
          else
            for file in $TARGET_FILES; do
              echo "Compressing $file ..."
              pngquant --force --ext .png --speed 1 --strip "$file"
            done
            echo "Compression completed."
          fi

      - name: Generate archive pages
        run: node scripts/generate_archive_pages.js

      - name: Generate index page
        run: node scripts/generate_index.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }} # mainブランチへのプッシュ時のみデプロイ
        with:
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./output # outputディレクトリの内容をgh-pagesブランチにデプロイ
          publish_branch: gh-pages # デプロイ先のブランチ名
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
